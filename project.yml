# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen generate
name: TonePilot
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  TonePilotCore:
    path: Packages/TonePilotCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""   # set your Apple team ID (or pick it in Signing & Capabilities)
targets:
  # On-device stem separation: demucs.cpp (MIT) + Eigen (MPL-2.0), fetched by Native/fetch-demucs.sh.
  CDemucs:
    type: library.static
    platform: iOS
    sources:
      - path: Native/CDemucs
      - path: Native/demucs/src
    settings:
      base:
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CLANG_CXX_LIBRARY: libc++
        GCC_OPTIMIZATION_LEVEL: "3"
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Native/demucs/src", "$(SRCROOT)/Native/eigen", "$(SRCROOT)/Native/CDemucs"]
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "NDEBUG=1", "EIGEN_NO_DEBUG=1", "EIGEN_USE_BLAS=1"]
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
        SKIP_INSTALL: YES
  TonePilot:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources/SoundFonts
        type: folder
        buildPhase: resources
      - path: App/Resources/Assets.xcassets
      - path: App/Resources/Models
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - package: TonePilotCore
      - target: CDemucs
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TonePilot
        CFBundleShortVersionString: "0.6.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: "Listen Mode analyses a song while it plays from your music app. The audio stays in memory on this iPhone and is discarded after analysis."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.tonepilot
        SWIFT_OBJC_BRIDGING_HEADER: App/Sources/TonePilot-Bridging-Header.h
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Native/CDemucs"]
        OTHER_LDFLAGS: ["$(inherited)", "-lc++", "-framework", "Accelerate"]
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
