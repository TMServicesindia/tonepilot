# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen generate
name: TonePilot
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  TonePilotCore:
    path: Packages/TonePilotCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""   # set your Apple team ID (or pick it in Signing & Capabilities)
targets:
  TonePilot:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources/SoundFonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: TonePilotCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TonePilot
        CFBundleShortVersionString: "0.4.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: "Listen Mode analyses a song while it plays from your music app. The audio stays in memory on this iPhone and is discarded after analysis."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.tonepilot
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
