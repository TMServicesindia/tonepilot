name: Inference test fixtures (no app build)

# Phase 1: generates the Basic Pitch *test model* reference outputs used by the inference
# back-end contract tests (Core ML, LiteRT, replay). CI only — the model is never shipped.
# Results are pushed to the `ci/inference-fixtures` branch for review before being committed.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Official Basic Pitch models (Apache-2.0)
        run: git clone --depth 1 https://github.com/spotify/basic-pitch /tmp/basic-pitch
      - name: Generate fixture
        run: |
          python -m pip install --quiet "numpy<2" ai-edge-litert onnxruntime
          python Native/tools/inference/make_basic_pitch_fixture.py /tmp/basic-pitch Packages/TonePilotCore/Tests/TonePilotCoreTests/Fixtures/inference/basic_pitch
      - name: Push to ci/inference-fixtures
        run: |
          git config user.name "tonepilot-ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -B ci/inference-fixtures
          git add Packages/TonePilotCore/Tests/TonePilotCoreTests/Fixtures/inference
          git commit -m "Inference fixtures [skip ci]"
          git push -f origin ci/inference-fixtures
