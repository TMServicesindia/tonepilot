name: Quick iPhone build (no tests)

# On request only: builds and publishes the app straight away, for trying new features while
# the full build (ios-build.yml, with the speed & crash gate) runs separately.
on:
  workflow_dispatch:

concurrency:
  group: ios-quick
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | tail -1)"

      - name: Sounds and native sources
        run: |
          curl -fsSL -o App/Resources/SoundFonts/GeneralUser-GS.sf2 https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/main/GeneralUser-GS.sf2
          curl -fsSL -o App/Resources/SoundFonts/GeneralUser-GS-LICENSE.txt https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/main/documentation/LICENSE.txt
          Native/fetch-demucs.sh
          Native/fetch-lame.sh
          mkdir -p App/Resources/Models
          curl -fsSL -o App/Resources/Models/DEMUCS-LICENSE.txt https://raw.githubusercontent.com/facebookresearch/demucs/main/LICENSE || true

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project TonePilot.xcodeproj -scheme TonePilot -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1 || true
          grep -E "error:" xcodebuild.log | sort -u | head -20 | while IFS= read -r l; do echo "::error title=Build::$l"; done
          grep -q "BUILD SUCCEEDED" xcodebuild.log
          file build/Build/Products/Release-iphoneos/TonePilot.app/TonePilot | grep -q arm64

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TonePilot.app Payload/
          zip -qry TonePilot.ipa Payload

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: quick-${{ github.run_number }}
          name: TonePilot quick build ${{ github.run_number }} (tests running separately)
          target_commitish: ${{ github.sha }}
          make_latest: false
          body: |
            Quick build for trying new features now. The speed & crash tests run in the full build;
            anything they find is fixed in the next build.
            Built from ${{ github.sha }}.
          files: TonePilot.ipa
