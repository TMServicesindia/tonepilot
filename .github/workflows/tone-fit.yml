name: Tone fit T3 — envelope / filter / vibrato fit judged by independent models (research only, no app build)

# DEV banks only (GeneralUser = same bank, TimGM6mb = cross-bank); "asis" and "performed" variants.
# The app's own nearest-sound check (EfficientAT) decides which fits are applied; PANNs CNN10 and
# MFCC judge against the part alone (no leakage). Pre-registered gate in tone_fit_eval.py.
# Rendered GM audio, not real songs.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Banks
        run: |
          apt-get update -qq && apt-get install -y -qq curl timgm6mb-soundfont > /dev/null
          curl -fsSL -o /tmp/GeneralUser-GS.sf2 https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/main/GeneralUser-GS.sf2
          sha256sum /tmp/GeneralUser-GS.sf2 /usr/share/sounds/sf2/TimGM6mb.sf2
      - name: Fit every bench part (as the app does) and render
        working-directory: Packages/TonePilotCore
        env:
          TP_SF2: /tmp/GeneralUser-GS.sf2
          TP_TONE_FIT_DUMP: /tmp/fdump
          TP_TONE_TARGETS: "same=/tmp/GeneralUser-GS.sf2,timgm=/usr/share/sounds/sf2/TimGM6mb.sf2"
        run: |
          swift test -c release --filter ToneFitBench 2>&1 | grep -E "FITBENCH|error:|Executed" | tail -5
          grep -q . /tmp/fdump/fits.json
      - uses: actions/upload-artifact@v4
        with: { name: fdump, path: /tmp/fdump, retention-days: 7 }

  score:
    needs: dump
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/download-artifact@v4
        with: { name: fdump, path: /tmp/fdump }
      - name: Install
        run: |
          pip install -q "numpy<2" scipy librosa
          pip install -q --index-url https://download.pytorch.org/whl/cpu "torch==2.2.2" "torchvision==0.17.2" "torchaudio==2.2.2"
          pip install -q panns-inference==0.1.1
          git clone -q --depth 1 https://github.com/fschmid56/EfficientAT /tmp/eat
      - name: Judge (CNN10 + MFCC vs the part alone; app check = EfficientAT)
        run: |
          set -o pipefail
          S=$GITHUB_WORKSPACE/Native/tools/instruments
          cd /tmp/eat && python $S/tone_fit_eval.py /tmp/fdump /tmp/fit.md --eat /tmp/eat 2>&1 | tee /tmp/fit.log | grep -E "^\||RESULT|Error|error" | tail -30
          grep "^RESULT" /tmp/fit.log | while IFS= read -r l; do echo "::notice title=Tone fit::$l"; done
      - name: Push to branch ci/tone-fit
        if: always()
        run: |
          [ -f /tmp/fit.md ] || exit 0
          cd $GITHUB_WORKSPACE
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git checkout -q --orphan ci/tone-fit && git rm -rqf . && mkdir -p fit
          cp /tmp/fit.md /tmp/fit.json /tmp/fdump/fits.json fit/; echo "commit ${GITHUB_SHA} · run ${GITHUB_RUN_ID}" > fit/SOURCE.txt
          git add fit && git commit -qm "Tone fit T3" && git push -qf origin ci/tone-fit
