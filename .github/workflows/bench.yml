name: Benchmarks (baselines, no app build)

# Phase 1 benchmark harness: analysis baselines (tempo/beats/meter, chords, sections, arpeggio)
# and tone matching on songs rendered from GeneralUser GS with known answers. Runs twice and
# fails if the results differ (reproducibility). Real-audio acceptance sets join in later phases.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 21 * * *"

permissions:
  contents: write   # pushes the results to branch ci/bench-results

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container: swift:6.0-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: GeneralUser GS (GeneralUser GS License v2.0)
        run: |
          apt-get update -qq && apt-get install -y -qq curl > /dev/null
          curl -fsSL -o /tmp/GeneralUser-GS.sf2 https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/main/GeneralUser-GS.sf2
      - name: Run twice
        working-directory: Packages/TonePilotCore
        env:
          TP_SF2: /tmp/GeneralUser-GS.sf2
        run: |
          set -o pipefail
          for i in 1 2; do
            swift test -c release --filter "AnalysisBaselineBenchmarks|ToneMatchingBenchmarks" 2>&1 | tee run$i.log
            grep -E "^(AUDIT|BENCH)" run$i.log | sort > results$i.txt
          done
          grep -E "RESULT" results1.txt | while IFS= read -r l; do echo "::notice title=Baseline::$l"; done
          if ! diff -u results1.txt results2.txt; then echo "::error title=Benchmarks::results differ between two runs (not reproducible)"; exit 1; fi
          echo "::notice title=Benchmarks::reproducible across two runs ($(wc -l < results1.txt) result lines)"
      - name: Push results to branch ci/bench-results
        if: always()
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cp Packages/TonePilotCore/results1.txt /tmp/results.txt 2>/dev/null || exit 0
          cp Packages/TonePilotCore/run1.log /tmp/run1.log 2>/dev/null || true
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan ci/bench-results && git rm -rqf . && mkdir -p bench
          cp /tmp/results.txt bench/results.txt; cp /tmp/run1.log bench/run1.log 2>/dev/null || true
          echo "commit ${GITHUB_SHA} · run ${GITHUB_RUN_ID} · $(date -u +%FT%TZ)" > bench/SOURCE.txt
          git add bench && git commit -qm "Benchmark results for ${GITHUB_SHA}" && git push -f origin ci/bench-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: Packages/TonePilotCore/results*.txt

  rhythm:
    # Phase 2: current analyzer vs Beat This! + cycle inference on rendered songs with known cycles
    # (incl. khanda chapu 5, misra chapu 7, adi 8). Beat This! runs through Core ML (macOS).
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | tail -1)"
      - name: GeneralUser GS and the converted Beat This! small model (branch ci/beat-this)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/GeneralUser-GS.sf2 https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/main/GeneralUser-GS.sf2
          git fetch -q origin +ci/beat-this:refs/remotes/origin/ci/beat-this
          git show origin/ci/beat-this:beat_this/BeatThisSmall.mlpackage.zip > /tmp/bt.zip
          (cd /tmp && unzip -q bt.zip) && ls -d /tmp/BeatThisSmall.mlpackage
      - name: Rhythm benchmark
        working-directory: Packages/TonePilotCore
        env:
          TP_SF2: /tmp/GeneralUser-GS.sf2
          TP_BEAT_THIS_MODEL: /tmp/BeatThisSmall.mlpackage
        run: |
          set -o pipefail
          swift test -c release --filter RhythmBenchmarks 2>&1 | tee rhythm.log
          grep -E "^RHYTHM (RESULT|SPEED|note)" rhythm.log | while IFS= read -r l; do echo "::notice title=Rhythm::$l"; done
          ! grep -qE "error:|with [1-9][0-9]* failures?" rhythm.log
      - name: Push results to branch ci/rhythm-results
        if: always()
        run: |
          [ -f Packages/TonePilotCore/rhythm.log ] || exit 0
          grep -E "^RHYTHM" Packages/TonePilotCore/rhythm.log > /tmp/rhythm.txt || true
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git checkout -q --orphan ci/rhythm-results && git rm -rqf . && mkdir -p rhythm && cp /tmp/rhythm.txt rhythm/results.txt
          echo "commit ${GITHUB_SHA} · run ${GITHUB_RUN_ID} · $(date -u +%FT%TZ)" > rhythm/SOURCE.txt
          git add rhythm && git commit -qm "Rhythm benchmark for ${GITHUB_SHA}" && git push -qf origin ci/rhythm-results
