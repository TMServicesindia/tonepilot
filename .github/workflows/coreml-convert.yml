name: Convert Demucs to Core ML

# Converts the htdemucs network to Core ML (GPU / Neural Engine) and checks it against PyTorch,
# then runs the app's own separator with it and compares against the CPU engine. When everything
# matches, the compiled model is published as a release asset that the iPhone build bundles:
#   https://github.com/<owner>/<repo>/releases/download/coreml-models/HTDemucs.mlmodelc.zip
on:
  push:
    branches: [main]
    paths: ["Native/coreml/**", "Native/tools/coreml_check/**", "App/Sources/Audio/CoreMLNetwork.swift", ".github/workflows/coreml-convert.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyTorch, coremltools, Demucs
        run: |
          python -m pip install --quiet "torch==2.4.1" "torchaudio==2.4.1" "coremltools==8.1" "numpy<2" einops
          python -m pip install --quiet "demucs==4.0.1"
      - name: Convert and verify against PyTorch
        run: |
          set -o pipefail
          python Native/coreml/convert_htdemucs.py HTDemucs.mlpackage 2>&1 | tee convert.log | grep -vE "^\s*$" | tail -20
          grep -E "^RESULT|^saved" convert.log | while IFS= read -r l; do echo "::notice title=Core ML::$l"; done
      - name: Compile
        run: |
          set -euo pipefail
          xcrun coremlcompiler compile HTDemucs.mlpackage .
          test -d HTDemucs.mlmodelc
          ditto -c -k --keepParent HTDemucs.mlmodelc HTDemucs.mlmodelc.zip
          echo "::notice title=Core ML size::$(du -sh HTDemucs.mlmodelc | cut -f1) compiled, $(du -sh HTDemucs.mlmodelc.zip | cut -f1) zipped"
      - name: Fetch demucs.cpp, Eigen and weights
        run: Native/fetch-demucs.sh --weights
      - name: The app's separator with Core ML vs the CPU engine
        working-directory: Native
        run: |
          set -euo pipefail
          trap 'grep -h "error:" "$GITHUB_WORKSPACE"/Native/build/*.log 2>/dev/null | head -20 | while IFS= read -r l; do echo "::error title=Compile::$l"; done; echo "::error title=Check::failed at line $LINENO: $BASH_COMMAND"' ERR
          sudo xcode-select -s /Applications/Xcode_16.4.app || true
          mkdir -p build/obj && cd build/obj
          for f in ../../demucs/src/*.cpp ../../CDemucs/tp_demucs.cpp; do
            clang++ -std=c++17 -O3 -DNDEBUG -DEIGEN_NO_DEBUG -DEIGEN_USE_BLAS -I../../demucs/src -I../../eigen -I../../CDemucs -c "$f" -o "$(basename "$f").o" &
          done
          wait
          cd ..
          swiftc -O -wmo -parse-as-library -module-name TonePilotCore -emit-module -emit-module-path TonePilotCore.swiftmodule -emit-library -static \
            $(find ../../Packages/TonePilotCore/Sources/TonePilotCore -name '*.swift') -o libTonePilotCore.a > core.log 2>&1
          swiftc -O -I . -L . -lTonePilotCore -import-objc-header ../CDemucs/tp_demucs.h \
            ../tools/coreml_check/main.swift ../../App/Sources/Audio/StemSeparator.swift ../../App/Sources/Audio/CoreMLNetwork.swift \
            obj/*.o -lc++ -framework Accelerate -framework CoreML -o coreml_check > cli.log 2>&1
          set +e
          ./coreml_check ../../App/Resources/Models/ggml-model-htdemucs-4s-f16.bin ../../HTDemucs.mlmodelc /tmp/mlcheck 30 > check.log 2>&1
          code=$?
          set -e
          grep -E "^RESULT|^ERROR" check.log | while IFS= read -r l; do echo "::notice title=App separator::$l"; done
          [ $code = 0 ] || grep -vE "Loading tensor|^\[|MB$" check.log | tail -8 | while IFS= read -r l; do echo "::error title=Check (exit $code)::$l"; done
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: HTDemucs-mlmodelc
          path: HTDemucs.mlmodelc.zip
      - name: Publish the model for the iPhone build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view coreml-models > /dev/null 2>&1 || gh release create coreml-models --title "Separation model (Core ML)" \
            --notes "htdemucs (Demucs v4, Meta AI, MIT licence) converted to Core ML at full 32-bit precision. Bundled into the iPhone app by the build." --latest=false
          gh release upload coreml-models HTDemucs.mlmodelc.zip --clobber
