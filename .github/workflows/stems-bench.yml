name: Stem separation benchmark

# Measures the on-device separator (demucs.cpp, htdemucs 4-source) on an Apple Silicon runner
# and checks that each part of a synthetic song lands in the right stem.
on:
  # Run on demand only (Mac minutes are limited).
  workflow_dispatch:

jobs:
  bench:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch demucs.cpp, Eigen and weights
        run: Native/fetch-demucs.sh --weights
      - name: Build
        working-directory: Native
        run: |
          set -euo pipefail
          mkdir -p build
          clang++ -std=c++17 -O3 -DNDEBUG -DEIGEN_NO_DEBUG -Idemucs/src -Ieigen -ICDemucs \
            -DEIGEN_USE_BLAS demucs/src/*.cpp CDemucs/tp_demucs.cpp tools/demucs_bench.cpp -framework Accelerate -o build/bench
      - name: Same output, faster (original engine vs TonePilot's optimised build)
        working-directory: Native
        run: |
          set -o pipefail
          SRC="demucs/src/*.cpp CDemucs/tp_demucs.cpp tools/demucs_bench.cpp"
          FLAGS="-std=c++17 -O3 -DNDEBUG -DEIGEN_NO_DEBUG -Idemucs/src -Ieigen -ICDemucs"
          clang++ $FLAGS -DTP_DEMUCS_REFERENCE $SRC -o build/bench_original
          clang++ $FLAGS -DEIGEN_USE_BLAS $SRC -framework Accelerate -o build/bench_fast
          M=../App/Resources/Models/ggml-model-htdemucs-4s-f16.bin
          run() {  # name binary threads seconds
            TP_TRACE=1 TP_DUMP=$1.f32 ./build/$2 $M $3 $4 > $1.log 2>/dev/null || true
            echo "::notice title=Speed $1::$(grep '^RESULT load' $1.log) — memory $(grep '^PEAK final' $1.log | sed 's/PEAK final //')"
          }
          run original bench_original 1 20
          run fast bench_fast 1 20
          python3 - <<'PY'
          import array, math
          a = array.array('f'); b = array.array('f')
          a.frombytes(open('original.f32','rb').read()); b.frombytes(open('fast.f32','rb').read())
          assert len(a) == len(b) and len(a) > 0, (len(a), len(b))
          err = sum((x - y) ** 2 for x, y in zip(a, b)); sig = sum(x * x for x in a)
          snr = 10 * math.log10(sig / max(err, 1e-30)); mx = max(abs(x - y) for x, y in zip(a, b))
          print(f"::notice title=Quality::optimised vs original: difference {snr:.0f} dB below the signal, largest sample difference {mx:.2e}")
          if snr < 90: print("::error title=Quality::optimised output differs from the original"); raise SystemExit(1)
          PY
          run fast-2workers bench_fast 2 40

      - name: Run (3 threads, 40 s of audio)
        working-directory: Native
        run: |
          set -o pipefail
          sysctl -n machdep.cpu.brand_string hw.ncpu || true
          ./build/bench ../App/Resources/Models/ggml-model-htdemucs-4s-f16.bin 3 40 2>&1 | grep -v "^Loading tensor\|MB$" | tee bench.log | tail -20
          grep -E "^RESULT|^part" bench.log | while IFS= read -r l; do echo "::notice title=Stems::$l"; done
          TP_TRACE=1 ./build/bench ../App/Resources/Models/ggml-model-htdemucs-4s-f16.bin 1 8 2>/dev/null | grep "^PEAK" | tail -25 | while IFS= read -r l; do echo "::notice title=Step memory::$l"; done
          for secs in 8; do
            /usr/bin/time -l ./build/bench ../App/Resources/Models/ggml-model-htdemucs-4s-f16.bin 1 $secs > /dev/null 2> t$secs.log || true
            echo "::notice title=demucs.cpp one block::$secs s → peak $(( $(awk '/maximum resident set size/ {print $1}' t$secs.log) / 1048576 )) MB"
          done
      - name: End-to-end test of the app's separator code (Swift)
        if: ${{ !contains(github.event.head_commit.message, '[trace-only]') && !contains(github.event.head_commit.message, '[speed]') }}
        working-directory: Native
        run: |
          set -euo pipefail
          trap 'grep -h "error:" build/*.log 2>/dev/null | head -20 | while IFS= read -r l; do echo "::error title=Compile::$l"; done; echo "::error title=E2E::failed at line $LINENO: $BASH_COMMAND"' ERR
          sudo xcode-select -s /Applications/Xcode_16.4.app || true
          mkdir -p build/obj && cd build/obj
          for f in ../../demucs/src/*.cpp ../../CDemucs/tp_demucs.cpp; do
            clang++ -std=c++17 -O3 -DNDEBUG -DEIGEN_NO_DEBUG -DEIGEN_USE_BLAS -I../../demucs/src -I../../eigen -I../../CDemucs -c "$f" -o "$(basename "$f").o" &
          done
          wait
          cd ..
          swiftc -O -wmo -parse-as-library -module-name TonePilotCore -emit-module -emit-module-path TonePilotCore.swiftmodule -emit-library -static \
            $(find ../../Packages/TonePilotCore/Sources/TonePilotCore -name '*.swift') -o libTonePilotCore.a 2>&1 | tee core.log
          swiftc -O -I . -L . -lTonePilotCore -import-objc-header ../CDemucs/tp_demucs.h \
            ../tools/main.swift ../../App/Sources/Audio/StemSeparator.swift ../../App/Sources/Audio/CoreMLNetwork.swift obj/*.o -lc++ -framework Accelerate -framework CoreML -o separate 2>&1 | tee cli.log
          ./separate ../../App/Resources/Models/ggml-model-htdemucs-4s-f16.bin /tmp/septest 2>&1 | grep -v "^Loading tensor\|MB$\|^\[" | tee e2e.log | tail -12
          grep -E "^RESULT|^part|::error" e2e.log | while IFS= read -r l; do echo "::notice title=App separator::$l"; done
          # Peak memory for a 4-minute song with 1, 2 and 4 workers (iOS closes apps that use too much).
          ./separate ../../App/Resources/Models/ggml-model-htdemucs-4s-f16.bin /tmp/memtrace 120 1 > memtrace.log 2>&1 || true
          grep "^MEM" memtrace.log | while IFS= read -r l; do echo "::notice title=Footprint::$l"; done
          for w in 1 2; do
            /usr/bin/time -l ./separate ../../App/Resources/Models/ggml-model-htdemucs-4s-f16.bin /tmp/sep$w 120 $w > run$w.log 2> time$w.log || true
            rss=$(awk '/maximum resident set size/ {print $1}' time$w.log)
            res=$(grep "^RESULT separated" run$w.log || echo "failed")
            echo "::notice title=Memory $w workers::peak $((rss / 1048576)) MB — $res"
          done
      - name: Show e2e logs
        if: always()
        working-directory: Native/build
        run: |
          for f in core.log cli.log e2e.log; do
            [ -f "$f" ] || { echo "::notice title=$f::(missing)"; continue; }
            tail -25 "$f" | while IFS= read -r l; do echo "::notice title=$f::$l"; done
          done
          ls -la . obj | head -30 | while IFS= read -r l; do echo "::notice title=ls::$l"; done
