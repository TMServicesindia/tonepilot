# Builds TonePilot for iPhone on a free GitHub-hosted Mac and publishes an unsigned .ipa.
# Install it on your iPhone with Sideloadly (free Apple ID) — see docs/INSTALL_ON_IPHONE.md.
name: Build iPhone app

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "android/**", "server/**", "**/*.md", ".github/workflows/android-build.yml", ".github/workflows/stems-bench.yml"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A new push cancels the previous still-running build.
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # to attach the .ipa to a GitHub Release on version tags

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | tail -1)"

      - name: Core tests (macOS)
        working-directory: Packages/TonePilotCore
        run: |
          set -o pipefail
          swift test -c release 2>&1 | tee ../../swifttest.log | grep -E "error:|failed|Executed .* tests" || true
          ! grep -qE "error:|with [1-9][0-9]* failures?" ../../swifttest.log
          grep "^SPEED" ../../swifttest.log | while IFS= read -r l; do echo "::notice title=Speed budget::$l"; done

      - name: Bundle GeneralUser GS sounds (GeneralUser GS License v2.0)
        run: |
          curl -fsSL -o App/Resources/SoundFonts/GeneralUser-GS.sf2 https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/main/GeneralUser-GS.sf2
          curl -fsSL -o App/Resources/SoundFonts/GeneralUser-GS-LICENSE.txt https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/main/documentation/LICENSE.txt
          ls -la App/Resources/SoundFonts

      - name: Stem separator sources and weights (demucs.cpp MIT, Eigen MPL-2.0, htdemucs MIT)
        run: |
          # Sources only: the models are downloaded inside the app (models-v1 release), not bundled.
          Native/fetch-demucs.sh
          Native/fetch-lame.sh
          mkdir -p App/Resources/Models
          curl -fsSL -o App/Resources/Models/DEMUCS-LICENSE.txt https://raw.githubusercontent.com/facebookresearch/demucs/main/LICENSE || true

      - name: MP3 export check (LAME + the app's encoder, macOS)
        run: |
          set -euo pipefail
          mkdir -p build-mp3 && cd build-mp3
          for f in ../Native/lame/libmp3lame/*.c; do
            clang -O2 -DHAVE_CONFIG_H -I../Native/CLame -I../Native/lame/include -I../Native/lame/libmp3lame -w -c "$f" -o "$(basename "$f").o"
          done
          printf '#include "lame.h"\n' > lame-bridge.h
          swiftc -O -I ../Native/lame/include -import-objc-header lame-bridge.h ../Native/tools/mp3_check/main.swift \
            ../App/Sources/Audio/Mp3Encoder.swift *.o -o mp3_check
          ./mp3_check | tee mp3.log
          grep "^RESULT" mp3.log | while IFS= read -r l; do echo "::notice title=MP3 export::$l"; done

      - name: In-app model download is published
        run: |
          if curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/models-v1/manifest.json" -o manifest.json; then
            python3 -c "import json; m=json.load(open('manifest.json'))['files']; [print(f'::notice title=Downloadable model::{k} {v[\"size\"]/1048576:.0f} MB') for k,v in m.items()]"
          else
            echo "::warning title=Models::models-v1/manifest.json isn't published yet — separation will fail to download until coreml-convert.yml publishes it"
          fi

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project TonePilot.xcodeproj -scheme TonePilot -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" xcodebuild.log | sort -u | head -80 || true
          # The .app folder exists even when compiling fails (resources are copied first):
          # require a successful build AND the compiled arm64 executable.
          grep -q "BUILD SUCCEEDED" xcodebuild.log
          test -f build/Build/Products/Release-iphoneos/TonePilot.app/TonePilot
          file build/Build/Products/Release-iphoneos/TonePilot.app/TonePilot | grep -q arm64
          # The separator must be linked in and its model bundled.
          APP=build/Build/Products/Release-iphoneos/TonePilot.app
          find "$APP" -name "*.bin" | sed 's/^/::notice title=Bundled model::/'
          # (no grep -q here: it exits early and pipefail then reports nm's SIGPIPE as a failure)
          if [ "$(nm "$APP/TonePilot" 2>/dev/null | grep -c tp_demucs_separate)" = "0" ]; then
            echo "::error title=Separator::tp_demucs symbols not found in the app binary"; exit 1
          fi
          if [ -n "$(find "$APP" -name '*.mlmodelc' -o -name 'ggml-model-*.bin')" ]; then
            echo "::error title=Size::a separation model is bundled in the app (they are downloaded in the app now)"; exit 1
          fi
          echo "::notice title=App size::$(du -sh "$APP" | cut -f1)"

      # Logs need a login to download; annotations are public, so surface errors there.
      # Speed & crash gate: the app is driven through every screen on an iPhone simulator. A crash,
      # a freeze or a blown budget stops the build here, before anything is published.
      - name: Speed & crash tests (iPhone simulator)
        run: |
          DEV=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          phones = [x for k, v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          pick = [x for x in phones if x['name'] in ('iPhone 16', 'iPhone 15')] or phones
          print(pick[0]['udid'])")
          echo "Simulator: $DEV"
          code=0
          xcodebuild test -project TonePilot.xcodeproj -scheme TonePilot -destination "id=$DEV" -derivedDataPath build-sim \
            -resultBundlePath UITests.xcresult > uitest.log 2>&1 || code=$?
          grep -E "Test Case .*(passed|failed)|error:|crashed|measured \[" uitest.log | sed -E 's/^.*Test Case .-\[TonePilotUITests\.//' | head -60
          grep -E "measured \[" uitest.log | sed -E "s/.*measured \[([^]]+)\] average: ([0-9.]+).*/\1: \2/" | sort -u | while IFS= read -r l; do echo "::notice title=App speed::$l"; done
          grep -E "error:|crashed" uitest.log | sort -u | head -15 | while IFS= read -r l; do echo "::error title=Speed & crash tests::$l"; done
          # Budgets on the simulator: launch under 4 s, peak memory under 1.5 GB.
          budgets=0
          python3 - <<'PY' || budgets=$?
          import re, sys
          log = open("uitest.log").read()
          def avg(name):
              m = re.findall(r"measured \[" + re.escape(name) + r"\] average: ([0-9.]+)", log)
              return max(map(float, m)) if m else None
          bad = []
          launch = avg("Duration (AppLaunch), s")
          if launch is not None and launch > 4: bad.append(f"launch takes {launch:.2f} s (budget 4 s)")
          peak = avg("Memory Peak Physical, kB")
          if peak is not None and peak > 1.5e6: bad.append(f"peak memory {peak/1024:.0f} MB (budget 1500 MB)")
          for b in bad: print(f"::error title=Speed budget::{b}")
          sys.exit(1 if bad else 0)
          PY
          [ $code = 0 ] && [ $budgets = 0 ]

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: speed-and-crash-tests
          path: |
            uitest.log
            UITests.xcresult
          if-no-files-found: ignore

      - name: Report errors as annotations
        if: failure()
        run: |
          for f in swifttest.log xcodebuild.log; do
            [ -f "$f" ] || continue
            grep -E "error:|Undefined symbol|ld: " "$f" | sed -E 's#^/Users/runner/work/[^/]+/[^/]+/##' | sort -u | head -45 | while IFS= read -r line; do
              echo "::error title=$f::${line}"
            done
          done
          if [ -f xcodebuild.log ] && ! grep -q "error:" xcodebuild.log; then tail -30 xcodebuild.log | while IFS= read -r l; do echo "::warning title=xcodebuild tail::$l"; done; fi

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TonePilot.app Payload/
          zip -qry TonePilot.ipa Payload
          ls -la TonePilot.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: TonePilot-ipa
          path: TonePilot.ipa
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: xcodebuild.log
          if-no-files-found: ignore

      # v0.3.1–v0.3.5 were published by a faulty check without the app executable; remove them.
      - name: Remove broken early releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in v0.3.1 v0.3.2 v0.3.3 v0.3.4 v0.3.5; do gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true; done

      # Every successful build of main becomes a release, so this link always has the newest app:
      # https://github.com/<owner>/<repo>/releases/latest/download/TonePilot.ipa
      - name: Publish release download
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v0.3.{0}', github.run_number) }}
          name: TonePilot ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('0.3.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Installable iPhone build of TonePilot (unsigned .ipa, includes GeneralUser GS sounds).
            Install with SideStore or Sideloadly using your Apple ID — see docs/INSTALL_ON_IPHONE.md.
            Built from ${{ github.sha }}.
          files: TonePilot.ipa
