# Builds TonePilot for iPhone on a free GitHub-hosted Mac and publishes an unsigned .ipa.
# Install it on your iPhone with Sideloadly (free Apple ID) — see docs/INSTALL_ON_IPHONE.md.
name: Build iPhone app

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "android/**", "server/**", "**/*.md", ".github/workflows/android-build.yml", ".github/workflows/stems-bench.yml"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: "Mac runner image (default macos-15; macos-14 + Xcode 16 when macos-15 has no capacity — the launch gate records the runner)"
        default: "macos-15"

# A new push cancels the previous still-running build.
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # to attach the .ipa to a GitHub Release on version tags

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | tail -1)"

      - name: Core tests (macOS)
        working-directory: Packages/TonePilotCore
        run: |
          set -o pipefail
          swift test -c release 2>&1 | tee ../../swifttest.log | grep -E "error:|failed|Executed .* tests" || true
          ! grep -qE "error:|with [1-9][0-9]* failures?" ../../swifttest.log
          grep "^SPEED" ../../swifttest.log | while IFS= read -r l; do echo "::notice title=Speed budget::$l"; done

      - name: Bundle GeneralUser GS sounds (GeneralUser GS License v2.0)
        run: |
          curl -fsSL -o App/Resources/SoundFonts/GeneralUser-GS.sf2 https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/main/GeneralUser-GS.sf2
          curl -fsSL -o App/Resources/SoundFonts/GeneralUser-GS-LICENSE.txt https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/main/documentation/LICENSE.txt
          ls -la App/Resources/SoundFonts

      - name: Stem separator sources and weights (demucs.cpp MIT, Eigen MPL-2.0, htdemucs MIT)
        run: |
          # Sources only: the models are downloaded inside the app (models-v1 release), not bundled.
          Native/fetch-demucs.sh
          Native/fetch-lame.sh
          mkdir -p App/Resources/Models
          curl -fsSL -o App/Resources/Models/DEMUCS-LICENSE.txt https://raw.githubusercontent.com/facebookresearch/demucs/main/LICENSE || true

      - name: MP3 export check (LAME + the app's encoder, macOS)
        run: |
          set -euo pipefail
          mkdir -p build-mp3 && cd build-mp3
          for f in ../Native/lame/libmp3lame/*.c; do
            clang -O2 -DHAVE_CONFIG_H -I../Native/CLame -I../Native/lame/include -I../Native/lame/libmp3lame -w -c "$f" -o "$(basename "$f").o"
          done
          printf '#include "lame.h"\n' > lame-bridge.h
          swiftc -O -I ../Native/lame/include -import-objc-header lame-bridge.h ../Native/tools/mp3_check/main.swift \
            ../App/Sources/Audio/Mp3Encoder.swift *.o -o mp3_check
          code=0
          ./mp3_check > mp3.log 2>&1 || code=$?
          cat mp3.log
          grep -E "^RESULT" mp3.log | while IFS= read -r l; do echo "::notice title=MP3 export::$l"; done
          [ $code = 0 ] || tail -12 mp3.log | while IFS= read -r l; do echo "::error title=MP3 export (exit $code)::$l"; done
          exit $code

      - name: Instrument recognition check (Apple sound classifier, macOS)
        # A measurement, reported with the build; it never blocks the app from being published.
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p build-instruments && cd build-instruments
          # The app's recogniser compiled together with the core (one module, so no import needed).
          sed '/^import TonePilotCore$/d' ../App/Sources/Audio/InstrumentRecognizer.swift > InstrumentRecognizer.swift
          if ! swiftc -O -target "$(uname -m)-apple-macos14" $(find ../Packages/TonePilotCore/Sources/TonePilotCore -name '*.swift') \
               InstrumentRecognizer.swift ../Native/tools/instrument_check/main.swift -o instrument_check > compile.log 2>&1; then
            grep -E "error:" compile.log | sort -u | head -10 | while IFS= read -r l; do echo "::warning title=Instrument check didn't compile::$l"; done
            exit 0
          fi
          code=0
          ./instrument_check ../App/Resources/SoundFonts/GeneralUser-GS.sf2 > instruments.log 2>&1 || code=$?
          cat instruments.log
          grep -E "^RESULT" instruments.log | while IFS= read -r l; do echo "::notice title=Instrument recognition::$l"; done
          grep -E "^MISS" instruments.log | while IFS= read -r l; do echo "::warning title=Instrument recognition::$l"; done
          [ $code = 0 ] || echo "::warning title=Instrument recognition::check exited $code"

      - name: Inference back-end contract (Core ML, Basic Pitch test model — CI only, not shipped)
        # Phase 1 gate: TonePilotCore's CoreMLBackend (used by the app) must load the official Basic Pitch nmp.mlpackage
        # (Apache-2.0) and reproduce the reference outputs of the official nmp.tflite within 1e-3 (CPU).
        run: |
          set -uo pipefail
          mkdir -p build-inference && cd build-inference
          git clone --depth 1 https://github.com/spotify/basic-pitch.git basic-pitch > /dev/null 2>&1
          if ! swiftc -O -target "$(uname -m)-apple-macos14" $(find ../Packages/TonePilotCore/Sources/TonePilotCore -name '*.swift') \
               ../Native/tools/inference_check/main.swift -o inference_check > compile.log 2>&1; then
            grep -E "error:" compile.log | sort -u | head -10 | while IFS= read -r l; do echo "::error title=Inference check didn't compile::$l"; done
            exit 1
          fi
          code=0
          ./inference_check basic-pitch/basic_pitch/saved_models/icassp_2022/nmp.mlpackage \
            ../Packages/TonePilotCore/Tests/TonePilotCoreTests/Fixtures/inference/basic_pitch > inference.log 2>&1 || code=$?
          cat inference.log
          grep -E "^RESULT" inference.log | while IFS= read -r l; do echo "::notice title=Inference contract::$l"; done
          [ $code = 0 ] || tail -20 inference.log | while IFS= read -r l; do echo "::error title=Inference contract (exit $code)::$l"; done
          exit $code

      - name: Nearest-sound search contract (bundled EfficientAT Core ML + tone tables)
        # The app's exact pipeline (Swift front-end → bundled Core ML model) must reproduce PyTorch's
        # embedding for the Gate 2 fixture (cosine > 0.99), and both bundled tone tables must load.
        run: |
          set -uo pipefail
          mkdir -p build-perceptual && cd build-perceptual
          if ! swiftc -O -target "$(uname -m)-apple-macos14" $(find ../Packages/TonePilotCore/Sources/TonePilotCore -name '*.swift') \
               ../Native/tools/perceptual_check/main.swift -o perceptual_check > compile.log 2>&1; then
            grep -E "error:" compile.log | sort -u | head -10 | while IFS= read -r l; do echo "::error title=Nearest-sound check didn't compile::$l"; done
            exit 1
          fi
          code=0
          ./perceptual_check ../App/Resources/ML/EfficientAT_mn10_as_fp16.mlpackage \
            ../Packages/TonePilotCore/Tests/TonePilotCoreTests/Fixtures/instruments/efficientat \
            ../App/Resources/ML/tone_table_harmonic.json ../App/Resources/ML/tone_table_plain.json > perceptual.log 2>&1 || code=$?
          cat perceptual.log
          grep -E "^RESULT" perceptual.log | while IFS= read -r l; do echo "::notice title=Nearest-sound contract::$l"; done
          [ $code = 0 ] || grep -E "^FAIL" perceptual.log | while IFS= read -r l; do echo "::error title=Nearest-sound contract::$l"; done
          exit $code

      - name: Licence gate (personal build) and Indian set manifest
        run: |
          python3 Native/tools/licences/check_manifest.py docs/LICENSES/manifest.json --self-test
          python3 Native/tools/licences/check_manifest.py docs/LICENSES/manifest.json --build personal
          python3 Native/tools/dataset/validate_indian_set.py docs/benchmark/indian-set/manifest.json --self-test
          python3 Native/tools/dataset/validate_indian_set.py docs/benchmark/indian-set/manifest.json

      - name: In-app model download is published
        run: |
          if curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/models-v1/manifest.json" -o manifest.json; then
            python3 -c "import json; m=json.load(open('manifest.json'))['files']; [print(f'::notice title=Downloadable model::{k} {v[\"size\"]/1048576:.0f} MB') for k,v in m.items()]"
          else
            echo "::warning title=Models::models-v1/manifest.json isn't published yet — separation will fail to download until coreml-convert.yml publishes it"
          fi

      - name: Design tokens in sync (JSON ↔ SwiftUI)
        run: python3 .github/scripts/check_tokens.py

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project TonePilot.xcodeproj -scheme TonePilot -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" xcodebuild.log | sort -u | head -80 || true
          # The .app folder exists even when compiling fails (resources are copied first):
          # require a successful build AND the compiled arm64 executable.
          grep -q "BUILD SUCCEEDED" xcodebuild.log
          test -f build/Build/Products/Release-iphoneos/TonePilot.app/TonePilot
          file build/Build/Products/Release-iphoneos/TonePilot.app/TonePilot | grep -q arm64
          # The separator must be linked in and its model bundled.
          APP=build/Build/Products/Release-iphoneos/TonePilot.app
          find "$APP" -name "*.bin" | sed 's/^/::notice title=Bundled model::/'
          # (no grep -q here: it exits early and pipefail then reports nm's SIGPIPE as a failure)
          if [ "$(nm "$APP/TonePilot" 2>/dev/null | grep -c tp_demucs_separate)" = "0" ]; then
            echo "::error title=Separator::tp_demucs symbols not found in the app binary"; exit 1
          fi
          if [ -n "$(find "$APP" -name '*.mlmodelc' -o -name 'ggml-model-*.bin')" ]; then
            echo "::error title=Size::a separation model is bundled in the app (they are downloaded in the app now)"; exit 1
          fi
          echo "::notice title=App size::$(du -sh "$APP" | cut -f1)"

      # Logs need a login to download; annotations are public, so surface errors there.
      # Speed & crash gate: the app is driven through every screen on an iPhone simulator. A crash,
      # a freeze or a blown budget stops the build here, before anything is published.
      - name: Speed & crash tests (iPhone simulator)
        # The owner can ask for a one-off release before the gate is green: a commit message with
        # [publish-anyway] still runs and reports every test, but doesn't hold back the download.
        continue-on-error: ${{ contains(github.event.head_commit.message, '[publish-anyway]') }}
        run: |
          DEV=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          phones = [x for k, v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          pick = [x for x in phones if x['name'] in ('iPhone 16', 'iPhone 15')] or phones
          print(pick[0]['udid'])")
          echo "Simulator: $DEV"
          code=0
          # The screen tour (design screenshots) runs in ui-screens.yml, not in the gate.
          xcodebuild test -project TonePilot.xcodeproj -scheme TonePilot -destination "id=$DEV" -derivedDataPath build-sim \
            -skip-testing:TonePilotUITests/ScreenTourUITests -resultBundlePath UITests.xcresult > uitest.log 2>&1 || code=$?
          grep -E "Test Case .*(passed|failed)|error:|crashed|measured \[" uitest.log | sed -E 's/^.*Test Case .-\[TonePilotUITests\.//' | head -60
          grep -E "measured \[" uitest.log | sed -E "s/.*measured \[([^]]+)\] average: ([0-9.]+).*/\1: \2/" | sort -u | while IFS= read -r l; do echo "::notice title=App speed::$l"; done
          grep -E "error:|crashed" uitest.log | sort -u | head -15 | while IFS= read -r l; do echo "::error title=Speed & crash tests::$l"; done
          # A failure without an "error:" line (app crash at launch, simulator or runner trouble): show the end of the log.
          if [ $code != 0 ] && ! grep -qE "error:" uitest.log; then
            grep -vE "^\s*$|^    (cd|export|builtin|/Applications)" uitest.log | tail -40 | while IFS= read -r l; do echo "::error title=Speed & crash tests (log tail)::$l"; done
          fi
          # Budgets on the simulator: launch median of 5 under 4 s (all five timings reported), peak memory under 1.5 GB.
          budgets=0
          TP_SIMULATOR="$(xcrun simctl list devices -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['name']+' ('+k.split('.')[-1]+')' for k,v in d.items() for x in v if x['udid']=='$DEV'))" 2>/dev/null)" \
            TP_APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' build-sim/Build/Products/*-iphonesimulator/TonePilot.app/Info.plist 2>/dev/null | head -1)" \
            python3 .github/scripts/launch_gate.py uitest.log launch-gate.json build || budgets=$?
          # Compare with the previous recorded build (history kept on branch ci/launch-history; never pruned).
          if git fetch -q origin ci/launch-history 2>/dev/null; then
            git show FETCH_HEAD:history.jsonl > prev-history.jsonl 2>/dev/null || true
            python3 - <<'PY' || true
          import json
          cur = json.load(open("launch-gate.json")); rows = [json.loads(l) for l in open("prev-history.jsonl") if l.strip()]
          prev = next((r for r in reversed(rows) if r.get("label") == "build" and r.get("launch")), None)
          if prev and cur.get("launch"):
              c, p = cur["launch"], prev["launch"]
              print(f"::notice title=Launch vs previous build::median {c['median_s']:.2f} s vs {p['median_s']:.2f} s (run {prev.get('run_id')}, {prev['runner'].get('image_version')}, {prev['runner'].get('cpu')})")
          PY
          fi
          [ $code = 0 ] && [ $budgets = 0 ]

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: speed-and-crash-tests
          path: |
            uitest.log
            launch-gate.json
            UITests.xcresult
          if-no-files-found: ignore

      # Every launch measurement is appended to ci/launch-history (pass or fail), so trends and slow runners stay visible.
      - name: Record launch history
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          [ -f launch-gate.json ] || exit 0
          git fetch -q origin ci/launch-history 2>/dev/null && git show FETCH_HEAD:history.jsonl > history.jsonl 2>/dev/null || : > history.jsonl
          python3 -c "import json;print(json.dumps(json.load(open('launch-gate.json'))))" >> history.jsonl
          D=$(mktemp -d); cp history.jsonl "$D/"; cd "$D"; git init -q; git checkout -q -b ci/launch-history
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add history.jsonl; git commit -qm "Launch history: run ${GITHUB_RUN_ID}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci/launch-history || echo "::warning title=Launch history::could not push (permissions)"

      - name: Report errors as annotations
        if: failure()
        run: |
          for f in swifttest.log xcodebuild.log; do
            [ -f "$f" ] || continue
            grep -E "error:|Undefined symbol|ld: " "$f" | sed -E 's#^/Users/runner/work/[^/]+/[^/]+/##' | sort -u | head -45 | while IFS= read -r line; do
              echo "::error title=$f::${line}"
            done
          done
          if [ -f xcodebuild.log ] && ! grep -q "error:" xcodebuild.log; then tail -30 xcodebuild.log | while IFS= read -r l; do echo "::warning title=xcodebuild tail::$l"; done; fi

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TonePilot.app Payload/
          zip -qry TonePilot.ipa Payload
          ls -la TonePilot.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: TonePilot-ipa
          path: TonePilot.ipa
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: xcodebuild.log
          if-no-files-found: ignore

      # v0.3.1–v0.3.5 were published by a faulty check without the app executable; remove them.
      - name: Remove broken early releases
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in v0.3.1 v0.3.2 v0.3.3 v0.3.4 v0.3.5; do gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true; done

      # Every successful build of main becomes a release, so this link always has the newest app:
      # https://github.com/<owner>/<repo>/releases/latest/download/TonePilot.ipa
      - name: Publish release download
        # Manual full builds of main publish too (same gate; used when push builds can't get a macos-15 runner).
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v0.3.{0}', github.run_number) }}
          name: TonePilot ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('0.3.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Installable iPhone build of TonePilot (unsigned .ipa, includes GeneralUser GS sounds).
            Install with SideStore or Sideloadly using your Apple ID — see docs/INSTALL_ON_IPHONE.md.
            Built from ${{ github.sha }} on ${{ inputs.runner || 'macos-15' }}; passed the full speed & crash gate.
          files: TonePilot.ipa
