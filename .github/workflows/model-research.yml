name: Model research scan (no app build)

# Research only: reads licence, size and gating facts for candidate models and datasets from the
# public Hugging Face and Zenodo APIs, and pushes the results to the `research/model-scan` branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Scan public model and dataset pages
        run: python3 Native/tools/research/hf_scan.py
      - name: Publish results to research/model-scan
        run: |
          git config user.name "tonepilot-research"
          git config user.email "research@users.noreply.github.com"
          git checkout -B research/model-scan
          git add docs/research
          git commit -m "Model research scan [skip ci]"
          git push -f origin research/model-scan
